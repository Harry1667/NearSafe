<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; background: #050403; }
  .canvas {
    position: relative; width: 1320px; height: 2868px;
    background: radial-gradient(circle at 50% 26%, #2b2113 0%, #140f08 45%, #050403 78%), #050403;
  }
  .headline {
    position: absolute; top: 150px; left: 60px; right: 60px; text-align: center;
    font-family: "Noto Serif TC", "Songti TC", serif; font-weight: 900; letter-spacing: -2px;
    color: #F6C94A; font-size: 104px; line-height: 1.18;
    text-shadow: 0 0 46px rgba(246, 201, 74, 0.35);
  }
  .phone {
    position: absolute; top: 520px; left: 170px; width: 980px; height: 2131px;
    border-radius: 128px; background: #000; padding: 15px;
    box-shadow: 0 0 0 3px rgba(246, 201, 74, 0.55), 0 0 90px 18px rgba(246, 201, 74, 0.38),
      0 0 220px 60px rgba(246, 201, 74, 0.22), 0 40px 120px rgba(0, 0, 0, 0.6);
  }
  .phone .screen-wrap {
    position: relative; width: 100%; height: 100%; border-radius: 114px; overflow: hidden; background: #000;
  }
  .phone .screen-wrap img.shot {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: top;
  }
  .phone .island {
    position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    width: 210px; height: 62px; background: #000; border-radius: 999px; z-index: 5;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="headline">隨時發現<br/>周遭危險</div>
    <div class="phone">
      <div class="screen-wrap">
        <img class="shot" src="src_03_eventlist.png" />
        <div class="island"></div>
      </div>
    </div>
  </div>
</body>
</html>
