services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nearsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nearsafe
      POSTGRES_PASSWORD: nearsafe_dev
      POSTGRES_DB: nearsafe
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearsafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nearsafe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
